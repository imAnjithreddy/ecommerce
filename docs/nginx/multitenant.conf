# NGINX Configuration for DTabs Commerce Multi-Tenant SaaS
# Handles wildcard subdomains (*.dtabs.tech) and custom merchant domains

# Upstream definitions
upstream web_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream api_upstream {
    server 127.0.0.1:5000;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name dtabs.tech *.dtabs.tech;
    return 301 https://$host$request_uri;
}

# Main Application & Wildcard Subdomains
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dtabs.tech *.dtabs.tech;

    ssl_certificate /etc/letsencrypt/live/dtabs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dtabs.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API Proxy
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js Storefront / Admin SSR & Assets
    location / {
        proxy_pass http://web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
